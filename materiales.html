<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umai - Materiales e Insumos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">

  <style>
    :root {
      --nav-bg: #5247e6;
      --bg-body: #f4f5f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --btn-blue: #0073ff;
      --btn-blue-hover: #005bb5;
      --border-color: #e2e8f0;
      --radius: 12px;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-dark); min-height: 100vh; }

    /* Navegación */
    navbar {
      background-color: var(--nav-bg);
      color: white;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand { font-size: 1.4rem; font-weight: 700; }
    .nav-links { display: flex; gap: 0.75rem; list-style: none; }
    .nav-links a {
      color: rgba(255, 255, 255, 0.85); text-decoration: none; font-size: 0.9rem; font-weight: 500;
      padding: 0.4rem 0.8rem; border-radius: 8px; transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: white; background-color: rgba(255, 255, 255, 0.18); }

    /* Layout */
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card {
      background: var(--card-bg); border-radius: var(--radius); padding: 1.5rem;
      border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; border-bottom: 2px solid var(--bg-body); padding-bottom: 0.5rem; }

    /* Formulario */
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    input, select {
      width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
      border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--btn-blue); }
    .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .btn {
      padding: 0.75rem 1.25rem; border: none; border-radius: 8px; font-weight: 600;
      cursor: pointer; background-color: var(--btn-blue); color: white; transition: background-color 0.2s;
    }
    .btn:hover { background-color: var(--btn-blue-hover); }

    /* Tabla */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; background-color: #f8fafc; }
    .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-weight: 600; }

    @media (max-width: 640px) {
      navbar { flex-direction: column; gap: 0.75rem; padding: 1rem; }
      .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; }
      .grid-2-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <navbar>
    <div class="nav-brand">🎂 Umai</div>
    <ul class="nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="recetas.html">Recetas</a></li>
      <li><a href="materiales.html" class="active">Materiales</a></li>
      <li><a href="presupuestos.html">Presupuestos</a></li>
    </ul>
  </navbar>

  <main class="container">
    <section class="card">
      <h2>🥄 Cargar Nuevo Material / Insumo</h2>
      <form id="form-ingrediente">
        <div class="form-group">
          <label for="ing-nombre">Nombre del Material / Insumo</label>
          <input type="text" id="ing-nombre" placeholder="Ej: Azúcar, Huevos, Harina 0000" required>
        </div>

        <div class="form-group">
          <label for="ing-unidad">Unidad de Medida</label>
          <select id="ing-unidad">
            <option value="g">Gramos (g) / Kilos (kg)</option>
            <option value="ml">Mililitros (ml) / Litros (lt)</option>
            <option value="un">Unidad / Pieza (un)</option>
          </select>
        </div>

        <div class="grid-2-col">
          <div class="form-group">
            <label for="ing-cantidad">Cant. Comprada</label>
            <input type="number" step="any" id="ing-cantidad" placeholder="Ej: 1000" required>
          </div>
          <div class="form-group">
            <label for="ing-precio">Precio Pagado ($)</label>
            <input type="number" step="any" id="ing-precio" placeholder="Ej: 1300" required>
          </div>
        </div>

        <button type="submit" class="btn">Guardar Insumo</button>
      </form>
    </section>

    <section class="card">
      <h2>Inventario de Insumos Registrados</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Presentación</th>
              <th>Precio Pagado</th>
              <th>Costo Unitario Base</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-materiales">
            <!-- Se carga dinámicamente desde Firestore -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/materiales.js"></script>
</body>
</html>
