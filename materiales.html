<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umai - Materiales e Insumos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">

  <!-- Hoja de Estilos Principal -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- CABECERA DE NAVEGACIÓN BASE -->
  <header class="app-header">
    <div class="nav-brand">🎂 Umai by Sami</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Panel</a></li>
        <li><a href="recetas.html">Recetas</a></li>
        <li><a href="materiales.html" class="active">Materiales</a></li>
        <li><a href="presupuestos.html">Presupuestos</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="form-titulo">🥄 Cargar Nuevo Material / Insumo</h2>
      <form id="form-ingrediente">
        <input type="hidden" id="ing-id">

        <div class="form-group">
          <label for="ing-nombre">Nombre del Material / Insumo</label>
          <input type="text" id="ing-nombre" placeholder="Ej: Azúcar, Huevos, Harina 0000" required>
        </div>

        <div class="form-group">
          <label for="ing-unidad">Unidad de Medida</label>
          <select id="ing-unidad">
            <option value="g">Gramos (g) / Kilos (kg)</option>
            <option value="ml">Mililitros (ml) / Litros (lt)</option>
            <option value="un">Unidad / Pieza (un)</option>
          </select>
        </div>

        <div class="grid-2-col">
          <div class="form-group">
            <label for="ing-cantidad">Cant. Comprada</label>
            <input type="number" step="any" id="ing-cantidad" placeholder="Ej: 1000" required>
          </div>
          <div class="form-group">
            <label for="ing-precio">Precio Pagado ($)</label>
            <input type="number" step="any" id="ing-precio" placeholder="Ej: 1300" required>
          </div>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
          <button type="submit" id="btn-submit-ingrediente" class="btn" style="flex: 1;">Guardar Insumo</button>
          <button type="button" id="btn-cancelar-edicion" class="btn btn-secondary" style="display: none;">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Inventario de Insumos Registrados</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Presentación</th>
              <th>Precio Pagado</th>
              <th>Costo Unitario Base</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-materiales">
            <!-- Se carga dinámicamente desde Firestore -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal para ver el detalle del insumo -->
  <div id="modal-detalle" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo">Detalle del Insumo</h3>
        <button class="close-modal" id="btn-cerrar-modal">&times;</button>
      </div>
      <div id="modal-body">
        <!-- Detalle renderizado con JS -->
      </div>
    </div>
  </div>

  <script type="module" src="js/materiales.js"></script>

  <!-- PIE DE PÁGINA BASE -->
  <footer class="app-footer">
    <p>Versión 1.0 - Copyright 2026 - Fernando Albornoz</p>
  </footer>

</body>
</html>
