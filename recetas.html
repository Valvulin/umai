<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umai Recetas - Recetas</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Librería para generar PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="nav-brand">
      <span>🥐</span> Umai Recetas
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="ingredientes.html">Ingredientes</a></li>
      <li><a href="recetas.html" class="active">Recetas</a></li>
      <li><a href="presupuestos.html">Presupuestos</a></li>
    </ul>
  </header>

  <main class="container">
    <section class="card">
      <h2>Nueva Receta</h2>
      <form id="form-receta">
        <input type="hidden" id="receta-id">
        
        <div class="grid-2-col">
          <div class="form-group">
            <label for="receta-nombre">Nombre de la Receta</label>
            <input type="text" id="receta-nombre" placeholder="Ej: Tarta de Jamón y Queso" required>
          </div>
          <div class="form-group">
            <label for="receta-rendimiento">Rendimiento (Porciones/Unidades)</label>
            <input type="number" id="receta-rendimiento" value="1" min="1" required>
          </div>
        </div>

        <div class="card" style="background-color: #f8fafc; border-style: dashed; padding: 1rem;">
          <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Ingredientes de la Receta</h3>
          <div class="grid-3-col">
            <div class="form-group">
              <label for="select-ingrediente">Ingrediente</label>
              <select id="select-ingrediente">
                <option value="">Seleccione un ingrediente...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ingrediente-cantidad">Cantidad Utilizada</label>
              <input type="number" id="ingrediente-cantidad" step="0.01" min="0" placeholder="Ej: 250">
            </div>
            <button type="button" id="btn-agregar-ingrediente" class="btn btn-secondary">Agregar</button>
          </div>

          <div id="lista-ingredientes-receta" style="margin-top: 1rem;">
            <!-- Ingredientes agregados -->
          </div>
        </div>

        <div class="costo-resumen">
          <div class="costo-row costo-total-final">
            <span>Costo Total Receta:</span>
            <span id="resumen-costo-receta">$0.00</span>
          </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
          <button type="submit" class="btn" style="flex: 1;">Guardar Receta</button>
          <button type="button" id="btn-cancelar-receta" class="btn btn-secondary" style="display: none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Lista de Recetas Guardadas -->
    <section class="card">
      <h2>Recetas Guardadas</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Rendimiento</th>
              <th>Costo Total ($)</th>
              <th style="text-align: center;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-recetas">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal Detalle Receta -->
  <div id="modal-receta" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Detalle de la Receta</h3>
        <button class="close-modal" id="btn-cerrar-modal-receta">&times;</button>
      </div>
      <div id="modal-body-receta">
        <!-- Contenido dinámico -->
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Umai Recetas - Desarrollado por Fernando Albornoz
  </footer>

  <script src="js/recetas.js"></script>
</body>
</html>
