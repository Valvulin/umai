<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umai - Gestión de Recetas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <navbar>
    <div class="nav-brand">🎂 Umai</div>
    <ul class="nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="recetas.html" class="active">Recetas</a></li>
      <li><a href="materiales.html">Materiales</a></li>
      <li><a href="presupuestos.html">Presupuestos</a></li>
    </ul>
  </navbar>

  <main class="container">
    <!-- Formulario de creación de receta -->
    <section class="card">
      <h2>📖 Nueva Receta Base</h2>
      <form id="form-receta">
        <div class="grid-2-col">
          <div class="form-group">
            <label for="receta-nombre">Nombre de la Receta</label>
            <input type="text" id="receta-nombre" placeholder="Ej: Bizcochuelo de Vainilla 20cm" required>
          </div>
          <div class="form-group">
            <label for="receta-rendimiento">Rendimiento (Porciones/Unidades)</label>
            <input type="text" id="receta-rendimiento" placeholder="Ej: 12 porciones o 1 torta" required>
          </div>
        </div>

        <!-- 1. Ingredientes / Insumos -->
        <div style="margin: 1.5rem 0 1rem 0;">
          <label style="font-size: 0.9rem; font-weight: 700; color: var(--text-dark);">1. Insumos e Ingredientes</label>
          <div class="grid-3-col" style="margin-top: 0.5rem;">
            <div class="form-group" style="margin-bottom:0;">
              <select id="select-insumo">
                <option value="">-- Seleccionar Insumo --</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <input type="number" step="any" id="insumo-cantidad" placeholder="Cantidad usada">
            </div>
            <button type="button" id="btn-agregar-insumo" class="btn btn-secondary">+ Agregar</button>
          </div>
        </div>

        <!-- Detalle dinámico de insumos cargados -->
        <div id="lista-insumos-receta" style="margin-bottom: 1.5rem;">
          <!-- Se agregan dinámicamente -->
        </div>

        <!-- 2. Mano de Obra y Costos Indirectos -->
        <div style="margin: 1.5rem 0 1rem 0; border-top: 1px dashed var(--border-color); padding-top: 1rem;">
          <label style="font-size: 0.9rem; font-weight: 700; color: var(--text-dark);">2. Mano de Obra y Packaging / Servicios</label>
          
          <div class="grid-2-col" style="margin-top: 0.75rem;">
            <div class="form-group">
              <label for="receta-horas">Horas de Trabajo (Tiempo de Elaboración)</label>
              <input type="number" step="any" id="receta-horas" placeholder="Ej: 1.5 (1 hs y media)" value="0" min="0">
            </div>
            <div class="form-group">
              <label for="receta-precio-hora">Valor de la Hora de Trabajo ($)</label>
              <input type="number" step="any" id="receta-precio-hora" placeholder="Ej: 3000" value="0" min="0">
            </div>
          </div>

          <div class="form-group">
            <label for="receta-packaging">Gastos Adicionales / Packaging / Servicios ($)</label>
            <input type="number" step="any" id="receta-packaging" placeholder="Ej: 500 (caja, blonda, gas/luz)" value="0" min="0">
          </div>
        </div>

        <!-- Resumen de Costos Estratificado -->
        <div class="costo-resumen">
          <div class="costo-row">
            <span>Costo Insumos Directos:</span>
            <span id="resumen-costo-insumos">$0.00</span>
          </div>
          <div class="costo-row">
            <span>Mano de Obra Calculada:</span>
            <span id="resumen-costo-mano-obra">$0.00</span>
          </div>
          <div class="costo-row">
            <span>Packaging y Gastos Varios:</span>
            <span id="resumen-costo-packaging">$0.00</span>
          </div>
          <div class="costo-row costo-total-final">
            <span>Costo Total de Producción:</span>
            <span id="costo-total-receta">$0.00</span>
          </div>
        </div>

        <button type="submit" class="btn" style="margin-top: 1rem; width: 100%;">Guardar Receta</button>
      </form>
    </section>

    <!-- Lista de recetas guardadas -->
    <section class="card">
      <h2>Recetas Guardadas</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Receta</th>
              <th>Rendimiento</th>
              <th>Tiempo / M.O.</th>
              <th>Insumos</th>
              <th>Costo Total</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-recetas">
            <!-- Se carga dinámicamente desde Firestore -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/recetas.js"></script>
</body>
</html>
