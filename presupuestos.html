<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umai - Presupuestos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Estilos del modal para ver presupuestos */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white; padding: 1.5rem; border-radius: var(--radius);
      width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .close-modal { font-size: 1.5rem; cursor: pointer; border: none; background: none; }
    
    /* Botones de acción */
    .action-btns { display: flex; gap: 0.4rem; }
    .btn-action { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0.2rem 0.4rem; border-radius: 4px; }
    .btn-action:hover { background-color: #e2e8f0; }
  </style>
</head>
<body>

  <navbar>
    <div class="nav-brand">🎂 Umai</div>
    <ul class="nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="recetas.html">Recetas</a></li>
      <li><a href="materiales.html">Materiales</a></li>
      <li><a href="presupuestos.html" class="active">Presupuestos</a></li>
    </ul>
  </navbar>

  <main class="container">
    <section class="card">
      <h2 id="form-titulo">💼 Generar Nuevo Presupuesto</h2>
      <form id="form-presupuesto">
        <input type="hidden" id="presupuesto-id">

        <div class="grid-2-col">
          <div class="form-group">
            <label for="presupuesto-cliente">Nombre del Cliente</label>
            <input type="text" id="presupuesto-cliente" placeholder="Ej: María Gómez" required>
          </div>
          <div class="form-group">
            <label for="presupuesto-receta">Receta Base</label>
            <select id="presupuesto-receta" required>
              <option value="">-- Seleccionar Receta --</option>
            </select>
          </div>
        </div>

        <div class="grid-2-col">
          <div class="form-group">
            <label for="presupuesto-cantidad">Cantidad / Multiplicador</label>
            <input type="number" step="any" id="presupuesto-cantidad" value="1" min="0.1" required>
          </div>
          <div class="form-group">
            <label for="presupuesto-margen">Margen de Ganancia (%)</label>
            <input type="number" step="any" id="presupuesto-margen" placeholder="Ej: 100" value="100" min="0" required>
          </div>
        </div>

        <!-- Resumen de Totales del Presupuesto -->
        <div class="costo-resumen">
          <div class="costo-row">
            <span>Costo Total de Producción:</span>
            <span id="resumen-costo-produccion">$0.00</span>
          </div>
          <div class="costo-row">
            <span>Ganancia Estimada:</span>
            <span id="resumen-ganancia">$0.00</span>
          </div>
          <div class="costo-row costo-total-final">
            <span>Precio Final Sugerido:</span>
            <span id="presupuesto-precio-final">$0.00</span>
          </div>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
          <button type="submit" id="btn-submit-presupuesto" class="btn" style="flex: 1;">Guardar Presupuesto</button>
          <button type="button" id="btn-cancelar-edicion" class="btn btn-secondary" style="display: none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Historial de Presupuestos -->
    <section class="card">
      <h2>Presupuestos Emitidos</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Receta</th>
              <th>Cant.</th>
              <th>Costo Total</th>
              <th>Precio Final</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-presupuestos">
            <!-- Carga dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal para ver el detalle del presupuesto -->
  <div id="modal-detalle" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo">Detalle de Presupuesto</h3>
        <button class="close-modal" id="btn-cerrar-modal">&times;</button>
      </div>
      <div id="modal-body">
        <!-- Renderizado dinámico -->
      </div>
    </div>
  </div>

  <script type="module" src="js/presupuestos.js"></script>
</body>
</html>
